name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Versions-Tag, z. B. v1.2.0 (wird auf dem gewählten Branch erstellt)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" cistern-level-card.js \
            --title "$TAG" --generate-notes --target "$GITHUB_SHA"
